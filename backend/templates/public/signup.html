<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu-AI Trace | Join the Academic &amp; Clinical Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen py-10 px-4 relative overflow-x-hidden">

    <!-- Ambient glow -->
    <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="bg-slate-900 border border-slate-800 p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-lg relative z-10">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-gradient-to-tr from-indigo-600 to-indigo-500 rounded-2xl flex items-center justify-center font-black text-white text-xl mx-auto shadow-lg shadow-indigo-600/30 mb-3">
                T
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                Join Edu-AI <span class="gradient-text">Trace</span>
            </h1>
            <p class="text-slate-400 text-xs sm:text-sm mt-1">Enroll your academic profile into the learning vault</p>
        </div>

        <form action="/signup" method="POST" id="signupForm" class="space-y-4">
            
            <!-- 1. Full Name -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">1. Full Name</label>
                <input type="text" name="full_name" id="fullName" required placeholder="e.g. Dr. Julius Kiptoo"
                    class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-slate-100 outline-none focus:border-indigo-500 transition">
            </div>

            <!-- 2. Verified Email with OTP -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">2. Verified Email Address</label>
                <div class="flex gap-2">
                    <input type="email" name="email" id="emailInput" required placeholder="student@university.edu"
                        class="flex-1 px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-slate-100 outline-none focus:border-indigo-500 transition">
                    <button type="button" id="sendOtpBtn" onclick="handleSendOtp()"
                        class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow-md shadow-indigo-600/20 whitespace-nowrap">
                        Send OTP
                    </button>
                </div>
                <p id="otpStatus" class="text-[11px] mt-1 text-slate-400"></p>

                <!-- OTP Input Field -->
                <div id="otpContainer" class="mt-2.5">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Enter 6-Digit Email Code</label>
                    <input type="text" name="otp" id="otpInput" maxlength="6" placeholder="• • • • • •"
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-indigo-500/60 font-mono tracking-widest text-center text-sm text-indigo-300 outline-none focus:border-indigo-400 transition">
                </div>
            </div>

            <!-- 3. Standard Security Password -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">3. Security Password (Min 6 characters)</label>
                <input type="password" name="password" id="passwordInput" required minlength="6" placeholder="Create a strong password"
                    class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-slate-100 outline-none focus:border-indigo-500 transition">
            </div>

            <!-- 4. Additional Profile Information -->
            <div class="pt-2 border-t border-slate-800/80">
                <span class="text-xs uppercase font-extrabold tracking-wider text-indigo-400 block mb-2">4. Academic &amp; Clinical Details</span>
                
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Age</label>
                        <input type="number" name="age" min="15" max="100" placeholder="e.g. 23"
                            class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm text-slate-100 outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Level of Study</label>
                        <select name="level_of_study"
                            class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-slate-200 outline-none focus:border-indigo-500 transition">
                            <option value="Year 1 - Pre-Clinical">Year 1 - Pre-Clinical</option>
                            <option value="Year 2 - Basic Sciences">Year 2 - Basic Sciences</option>
                            <option value="Year 3 - Junior Clerkship">Year 3 - Junior Clerkship</option>
                            <option value="Year 4 - Medical Candidate" selected>Year 4 - Senior Clerkship</option>
                            <option value="Year 5 - Final Year Candidate">Year 5 - Final Candidate</option>
                            <option value="Post-Graduate / Resident">Post-Graduate / Resident</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Course Pursued</label>
                        <input type="text" name="course_pursued" required placeholder="e.g. MBChB, Clinical Medicine, Nursing"
                            value="MBChB - Bachelor of Medicine and Bachelor of Surgery"
                            class="w-full px-4 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-slate-100 outline-none focus:border-indigo-500 transition">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Referral Link / Invitation Code (Optional)</label>
                        <input type="text" name="referral_code" placeholder="e.g. TRACE-REF-2026 or Dean Invite"
                            class="w-full px-4 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-slate-100 outline-none focus:border-indigo-500 transition">
                    </div>
                </div>
            </div>

            <!-- Role Hidden / Student Default -->
            <input type="hidden" name="role" value="Student">

            <button type="submit" id="submitBtn"
                class="w-full mt-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm">
                ENROLL &amp; CREATE ACCOUNT
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-400 space-y-2">
            <p>Already have an account? <a href="/welcome" class="text-indigo-400 font-bold hover:underline">Return to Trace Portal</a></p>
            <p><a href="/archives" class="text-slate-500 hover:text-slate-300">Download Mobile APK &rarr;</a></p>
        </div>
    </div>

    <script>
        async function handleSendOtp() {
            const email = document.getElementById("emailInput").value.trim();
            const statusElem = document.getElementById("otpStatus");
            const btn = document.getElementById("sendOtpBtn");

            if (!email || !email.includes("@")) {
                statusElem.textContent = "Please enter a valid email address first.";
                statusElem.className = "text-[11px] mt-1 text-rose-400";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Sending...";
            statusElem.textContent = "Generating verification code...";
            statusElem.className = "text-[11px] mt-1 text-indigo-400";

            try {
                const res = await fetch("/api/auth/send-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, action: "signup" })
                });
                const data = await res.json();
                if (res.ok) {
                    statusElem.textContent = data.message + (data.otp_preview ? ` (Preview code: ${data.otp_preview})` : "");
                    statusElem.className = "text-[11px] mt-1 text-emerald-400 font-medium";
                    if (data.otp_preview) {
                        document.getElementById("otpInput").value = data.otp_preview;
                    }
                } else {
                    statusElem.textContent = data.detail || "Could not send verification code.";
                    statusElem.className = "text-[11px] mt-1 text-rose-400";
                }
            } catch (err) {
                statusElem.textContent = "Connection error. Make sure server is reachable.";
                statusElem.className = "text-[11px] mt-1 text-rose-400";
            } finally {
                btn.disabled = false;
                btn.textContent = "Resend OTP";
            }
        }
    </script>
</body>
</html>
