################################################################################
# FILE: .github/workflows/hf-sync.yml
# VERSION: 1.1.0 | SYSTEM: Hugging Face CI/CD Bot
################################################################################

name: Sync Backend to Hugging Face Space

on:
  push:
    branches:
      - main
      - Backend-dedicated
    paths:
      - "backend/**"
      - ".github/workflows/hf-sync.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push backend only to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: Agent606
          HF_SPACE_NAME: Trace
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN is not configured in repository secrets." >&2
            exit 1
          fi

          SOURCE_BRANCH="${GITHUB_REF_NAME}"
          SOURCE_SHA="${GITHUB_SHA}"

          cd backend

          git init
          git config user.name "Orbit Automations"
          git config user.email "bot@orbit.local"

          git add -A
          git commit -m "Auto-sync ${SOURCE_BRANCH} ${SOURCE_SHA}" --allow-empty

          HF_REMOTE="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          git push --force "${HF_REMOTE}" HEAD:main

          echo "Backend deployed to Hugging Face from ${SOURCE_BRANCH} (${SOURCE_SHA})."
